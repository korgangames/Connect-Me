name: Build Connect Me (Windows, Android & Linux Standalone)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows (.NET Desktop & Tests)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows Solution
        run: dotnet build ConnectMe.sln -c Release

      - name: Run Protocol & Edge Topology Tests
        run: dotnet run --project windows/ConnectMe.Tests/ConnectMe.Tests.csproj -c Release --no-build

      - name: Publish Windows App (Self-Contained Standalone GUI)
        run: |
          dotnet publish windows/ConnectMe.Windows/ConnectMe.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/windows
          Move-Item publish/windows/ConnectMe.Windows.exe publish/windows/ConnectMe.exe
          Compress-Archive -Path publish/windows/ConnectMe.exe -DestinationPath publish/ConnectMe-Windows-x64v1-4-3.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ConnectMe-Windows-x64
          path: publish/ConnectMe-Windows-x64v1-4-3.zip

  build-android:
    name: 📱 Android APK (Kotlin 120Hz Overlay & KVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          keytool -genkeypair -v -keystore connectme-release.jks -alias connectme -keyalg RSA -keysize 2048 -validity 10000 -storepass connectmepassword123 -keypass connectmepassword123 -dname "CN=Korgan Games, OU=Connect Me, O=Korgan Games, C=TR"
          gradle assembleRelease --no-daemon
          mkdir -p ../publish
          cp app/build/outputs/apk/release/*.apk ../publish/ConnectMeV1-4-3.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ConnectMe-Android-APK
          path: publish/ConnectMeV1-4-3.apk

  package-linux:
    name: 🐧 Linux Package (Nobara / KDE Plasma GUI & Launcher)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare Linux Standalone Package
        run: |
          mkdir -p package/ConnectMe-Linux
          cp -r linux/* package/ConnectMe-Linux/
          chmod +x package/ConnectMe-Linux/*.sh package/ConnectMe-Linux/*.py
          mkdir -p publish
          tar -czvf publish/ConnectMe-Linux-x64v1-4-3.tar.gz -C package ConnectMe-Linux

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ConnectMe-Linux-x64
          path: publish/ConnectMe-Linux-x64v1-4-3.tar.gz

  release:
    name: 🚀 Publish GitHub Release Packages
    needs: [build-windows, build-android, package-linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Windows Package
        uses: actions/download-artifact@v7
        with:
          name: ConnectMe-Windows-x64
          path: release-assets/windows

      - name: Download Android Package
        uses: actions/download-artifact@v7
        with:
          name: ConnectMe-Android-APK
          path: release-assets/android

      - name: Download Linux Package
        uses: actions/download-artifact@v7
        with:
          name: ConnectMe-Linux-x64
          path: release-assets/linux

      - name: Prepare Release Folder
        run: |
          mkdir -p dist
          find release-assets/ -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.4.3
          name: "Connect Me v1.4.3 (v1-4-3) — Windows, Android & Linux Standalone"
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
